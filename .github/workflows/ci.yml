name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: Instalar dependências
        run: deno install --frozen

      - name: Formatação
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check src tests scripts

      - name: Versão e changelog
        run: deno task check:release

      - name: Testes com cobertura
        run: deno task test:coverage

      - name: Relatório de cobertura
        run: deno coverage coverage

      - name: Exportar LCOV
        run: deno coverage coverage --lcov --output=coverage.lcov

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.lcov
          if-no-files-found: error

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Build (Vite + PWA)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - name: Instalar dependências
        working-directory: web
        run: npm ci

      - name: Instalar dependências Deno
        run: deno install --frozen

      - name: Typecheck (svelte-check)
        working-directory: web
        run: npm run check

      - name: Build (Vite + PWA)
        working-directory: web
        run: npm run build

      - name: Instalar navegadores Playwright
        working-directory: web
        run: npx playwright install --with-deps

      - name: Subir API de teste
        run: |
          deno task start &
          sleep 3
          curl -fsS http://127.0.0.1:3000/ready

      - name: Executar testes E2E
        working-directory: web
        run: npx playwright test

      - name: Archive playwright test results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/tests/e2e/
          if-no-files-found: warn

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build da API
        run: docker build -t vivabem:ci .

      - name: Build do frontend
        run: docker build -t vivabem-web:ci ./web
