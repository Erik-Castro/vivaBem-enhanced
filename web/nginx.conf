# Viva Bem — SPA estática com proxy para a API.
# A imagem roda como usuário não-root (nginx-unprivileged) na porta 8080.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # O CORS da API é feito por origem; o proxy mantém o host original.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Cabeçalhos herdados por todas as locations sem add_header próprio.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;

  # Healthcheck do container; não expõe informação da API.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API e endpoints de saúde são encaminhados para o serviço da API.
  location /api/ {
    proxy_pass http://vivabem:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location = /health {
    proxy_pass http://vivabem:3000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ready {
    proxy_pass http://vivabem:3000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets com hash no nome podem ser cacheados agressivamente.
  location ~* \.(?:js|css|svg|png|webp|ico|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  # O service worker precisa ser revalidado para pegar novas versões.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    expires -1;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Fallback do SPA. Rotas são resolvidas no cliente via hash.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
