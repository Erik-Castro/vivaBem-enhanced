# Viva Bem — SPA estática com proxy para a API.
# A imagem roda como usuário não-root (nginx-unprivileged) na porta 8080.

# CSP por rota: o SPA tem a sua; a API responde JSON e não precisa carregar
# nada; o Swagger UI (`/api/docs`) usa CDN e script inline. Um único `add_header`
# no server mantém a herança para todas as locations (um `add_header` local
# desativaria os demais headers do server).
http {
  map $uri $content_security_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'";
    ~^/api/docs "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    ~^/api/ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    ~^/health$ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    ~^/ready$ "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
  }

  server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # O CORS da API é feito por origem; o proxy mantém o host original.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Cabeçalhos herdados por todas as locations sem add_header próprio.
  # HSTS também no SPA: o middleware da API só cobre /api/*, e o documento
  # principal precisa ser protegido contra downgrade.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy $content_security_policy always;

  # Healthcheck do container; não expõe informação da API.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API e endpoints de saúde são encaminhados para o serviço da API.
  location /api/ {
    proxy_pass http://vivabem:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # A API também envia estes headers; sem esconder o upstream eles sairiam
    # duplicados. O Nginx é o dono dos headers na borda (inclusive CSP e HSTS).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Content-Security-Policy;
  }

  location = /health {
    proxy_pass http://vivabem:3000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Content-Security-Policy;
  }

  location = /ready {
    proxy_pass http://vivabem:3000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;
    proxy_hide_header Content-Security-Policy;
  }

  # Assets com hash no nome podem ser cacheados agressivamente.
  location ~* \.(?:js|css|svg|png|webp|ico|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  # O service worker precisa ser revalidado para pegar novas versões.
  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    expires -1;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Fallback do SPA. Rotas são resolvidas no cliente via hash.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}

}
