# Viva Bem — Stack do Portainer

version: "3.8"

services:
  vivabem:
    image: erikcastro255/vivabem:${VERSION:-1.0.0}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/app.db
      APP_ORIGIN: ${APP_ORIGIN:?defina APP_ORIGIN no Portainer}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no Portainer}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AI_ENABLED: ${AI_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - vivabem-data:/app/data
      - vivabem-backups:/app/backups
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:3000/health'); if (!r.ok) Deno.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: erikcastro255/vivabem:${VERSION:-1.0.0}
    command: ["deno", "task", "worker"]
    restart: unless-stopped
    stop_grace_period: 35s
    profiles: ["ai"]
    environment:
      ENV: production
      DATABASE_PATH: /app/data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-60000}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_MODEL_CHAT_NAME: ${AI_API_MODEL_CHAT_NAME:-}
      AI_API_MODEL_EMBEDDINGS_NAME: ${AI_API_MODEL_EMBEDDINGS_NAME:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.7}
      AI_MAX_EVENTS_PER_BATCH: ${AI_MAX_EVENTS_PER_BATCH:-10}
      AI_CORRELATION_THRESHOLD: ${AI_CORRELATION_THRESHOLD:-50}
      WORKER_ID: ${WORKER_ID:-worker-01}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-60000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-15000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-30000}
    volumes:
      - vivabem-data:/app/data
    healthcheck:
      disable: true

  web:
    image: erikcastro255/vivabem-web:${VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      vivabem:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  vivabem-data:
    name: vivabem-data
  vivabem-backups:
    name: vivabem-backups
